<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI - 伝説の狐 (Legendary Fox)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div id="particles-js"></div>

    <div class="flying-fox-container">
        <div class="fox-spirit">🦊</div>
    </div>

    <div class="shrine-container">
        <div class="shrine-roof"></div>
        
        <header>
            <h1>神聖なアイリス</h1>
            <p>Sacred Iris Divination</p>
        </header>

        <form action="{{ url_for('predict') }}" method="post">
            <div class="input-grid">
                <div class="input-item">
                    <label>Sepal Length</label>
                    <input type="number" step="0.1" name="sl" placeholder="5.1" required>
                </div>
                <div class="input-item">
                    <label>Sepal Width</label>
                    <input type="number" step="0.1" name="sw" placeholder="3.5" required>
                </div>
                <div class="input-item">
                    <label>Petal Length</label>
                    <input type="number" step="0.1" name="pl" placeholder="1.4" required>
                </div>
                <div class="input-item">
                    <label>Petal Width</label>
                    <input type="number" step="0.1" name="pw" placeholder="0.2" required>
                </div>
            </div>

            <button type="submit" class="mystic-btn">
                運命を占う (Analyze)
            </button>
        </form>

        {% if result %}
        <div class="result-scroll fade-in">
            <div class="seal">合格</div>
            <h2>{{ result }}</h2>
            <p>The Spirits have spoken.</p>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
